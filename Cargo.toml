[package]
name = "calendar_tray"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
icalendar = { version = "0.17.13", features = ["recurrence"] }
native-windows-derive = "1.0.5"
native-windows-gui = "1.0.13"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
tray-icon = "0.25.1"
ureq = "3.4.2"

[build-dependencies]
embed-manifest = "1.5.1"
